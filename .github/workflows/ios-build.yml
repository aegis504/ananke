name: Build iOS App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        env:
          VITE_SUPABASE_URL: "https://mxzlvcmhxdsfhauujfko.supabase.co"
          VITE_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im14emx2Y21oeGRzZmhhdXVqZmtvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQxOTQxNTMsImV4cCI6MjA4OTc3MDE1M30.ghQW1HDMSvzLyoeieLmzBqTuPYu3Yfu6vB2--2j1ofc"
          FEATHERLESS_API_KEY_1: "rc_937ecb8c517d9496fab69226c8a6c6fc07b6ee45554170b039d9ea360a4db5b8"
          FEATHERLESS_API_KEY_2: "rc_2537200bac7b727eb19d6b157835a16e6f40b7c4071d9a56f4784b7740275665"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Build Xcode Project
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
                     -scheme App \
                     -configuration Debug \
                     -sdk iphoneos \
                     -allowProvisioningUpdates \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGN_STYLE=Manual \
                     CODE_SIGNING_REQUIRED=NO

      - name: Create unsigned IPA (Payload zip)
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Debug-iphoneos/App.app Payload/
          zip -r Ananke.ipa Payload
          rm -rf Payload

      - name: Create Release with IPA
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: ios-latest
          name: Ananke iOS (Latest - Unsigned)
          body: |
            ## Ananke iOS App (Unsigned)
            Auto-built from latest main branch.
            
            **Note:** This is an **unsigned** IPA. To install it on a physical device, you will likely need to use a tool like **AltStore**, **Sideloadly**, or have a jailbroken device.
            
            **Install:** Download `Ananke.ipa`.
          files: Ananke.ipa
          target_commitish: main
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
