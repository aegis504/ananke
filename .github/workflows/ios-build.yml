name: Build iOS App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          FEATHERLESS_API_KEY_1: ${{ secrets.FEATHERLESS_API_KEY_1 }}
          FEATHERLESS_API_KEY_2: ${{ secrets.FEATHERLESS_API_KEY_2 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Build Xcode Project
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
                     -scheme App \
                     -configuration Debug \
                     -sdk iphoneos \
                     -allowProvisioningUpdates \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGN_STYLE=Manual \
                     CODE_SIGNING_REQUIRED=NO

      - name: Create unsigned IPA (Payload zip)
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Debug-iphoneos/App.app Payload/
          zip -r Ananke.ipa Payload
          rm -rf Payload

      - name: Create Release with IPA
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: ios-latest
          name: Ananke iOS (Latest - Unsigned)
          body: |
            ## Ananke iOS App (Unsigned)
            Auto-built from latest main branch.
            
            **Note:** This is an **unsigned** IPA. To install it on a physical device, you will likely need to use a tool like **AltStore**, **Sideloadly**, or have a jailbroken device.
            
            **Install:** Download `Ananke.ipa`.
          files: Ananke.ipa
          target_commitish: main
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
