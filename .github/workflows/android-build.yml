name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        env:
          VITE_SUPABASE_URL: "https://mxzlvcmhxdsfhauujfko.supabase.co"
          VITE_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im14emx2Y21oeGRzZmhhdXVqZmtvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQxOTQxNTMsImV4cCI6MjA4OTc3MDE1M30.ghQW1HDMSvzLyoeieLmzBqTuPYu3Yfu6vB2--2j1ofc"
          FEATHERLESS_API_KEY_1: "rc_937ecb8c517d9496fab69226c8a6c6fc07b6ee45554170b039d9ea360a4db5b8"
          FEATHERLESS_API_KEY_2: "rc_2537200bac7b727eb19d6b157835a16e6f40b7c4071d9a56f4784b7740275665"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ananke-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Rename APK for Release
        run: mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/Ananke.apk

      - name: Create Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: android-latest
          name: Ananke Android (Latest)
          body: |
            ## Ananke Android App
            Auto-built from latest main branch.
            **Install:** Download and open `Ananke.apk` on your Android device.
            > You may need to enable "Install from unknown sources" in Android settings.
          files: android/app/build/outputs/apk/debug/Ananke.apk
          target_commitish: main
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
